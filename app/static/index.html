<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniBrand Copilot - Multi-Channel Content Automation Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' }
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
  </style>
</head>
<body class="min-h-screen p-4 md:p-8">
  <div class="max-w-6xl mx-auto space-y-6">
    
    <!-- Header -->
    <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 border-b border-slate-800 pb-6">
      <div>
        <div class="flex items-center gap-3">
          <span class="text-3xl">✨</span>
          <h1 class="text-3xl font-extrabold tracking-tight bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">
            OmniBrand Copilot
          </h1>
        </div>
        <p class="text-slate-400 text-sm mt-1">Multi-Channel Content Automation with Automated Brand Constitution Guardrails</p>
      </div>
      <div class="flex items-center gap-3">
        <span class="px-3 py-1 text-xs font-semibold rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          Guardrails Active
        </span>
        <span class="px-3 py-1 text-xs font-semibold rounded-full bg-indigo-500/20 text-indigo-400 border border-indigo-500/30">
          FastAPI Backend
        </span>
      </div>
    </header>

    <!-- Main Workspace Grid -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
      
      <!-- Left Column: Source Input -->
      <div class="lg:col-span-5 space-y-4">
        <div class="glass-card rounded-2xl p-5 space-y-4">
          <div class="flex justify-between items-center">
            <h2 class="font-bold text-lg text-slate-200">1. Source Document</h2>
            <button onclick="loadSample()" class="text-xs text-indigo-400 hover:text-indigo-300 transition-colors">
              + Load Sample Notes
            </button>
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Campaign Headline (Optional)</label>
            <input type="text" id="campaignTitle" placeholder="e.g. Autonomous Data Pipelines v2.4 Launch" 
                   class="w-full bg-slate-900/80 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Long-Form Release Notes / Post</label>
            <textarea id="sourceText" rows="10" placeholder="Paste product release notes, technical whitepaper, or blog draft here..."
                      class="w-full bg-slate-900/80 border border-slate-700 rounded-lg p-3 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 font-mono text-xs leading-relaxed"></textarea>
          </div>
          <div class="space-y-2">
            <label class="block text-xs font-medium text-slate-400">Target Channels</label>
            <div class="grid grid-cols-2 gap-2 text-xs">
              <label class="flex items-center gap-2 p-2 rounded-lg bg-slate-800/50 cursor-pointer hover:bg-slate-800">
                <input type="checkbox" id="chkTwitter" checked class="accent-indigo-500"> Twitter/X Thread
              </label>
              <label class="flex items-center gap-2 p-2 rounded-lg bg-slate-800/50 cursor-pointer hover:bg-slate-800">
                <input type="checkbox" id="chkLinkedIn" checked class="accent-indigo-500"> LinkedIn Post
              </label>
              <label class="flex items-center gap-2 p-2 rounded-lg bg-slate-800/50 cursor-pointer hover:bg-slate-800">
                <input type="checkbox" id="chkNewsletter" checked class="accent-indigo-500"> Newsletter Digest
              </label>
              <label class="flex items-center gap-2 p-2 rounded-lg bg-slate-800/50 cursor-pointer hover:bg-slate-800">
                <input type="checkbox" id="chkExecutive" checked class="accent-indigo-500"> Exec Brief
              </label>
            </div>
          </div>
          <button id="btnGenerate" onclick="generateCampaign()" 
                  class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-500 font-bold rounded-xl shadow-lg shadow-indigo-600/30 transition-all flex justify-center items-center gap-2 text-sm">
            <span>Generate Multi-Channel Campaign</span>
            <span>⚡</span>
          </button>
        </div>
      </div>

      <!-- Right Column: Generated Output & Guardrail Compliance -->
      <div class="lg:col-span-7 space-y-4">
        
        <!-- Compliance Card -->
        <div id="complianceCard" class="glass-card rounded-2xl p-5 border-l-4 border-slate-600 transition-all">
          <div class="flex items-center justify-between">
            <div>
              <div class="text-xs uppercase tracking-wider font-semibold text-slate-400">Brand Constitution Audit</div>
              <div class="flex items-center gap-3 mt-1">
                <span id="complianceScore" class="text-3xl font-black text-slate-300">--%</span>
                <span id="complianceBadge" class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-slate-800 text-slate-400">
                  Awaiting Generation
                </span>
              </div>
            </div>
            <div id="checksSummary" class="text-right text-xs text-slate-400 hidden md:block">
              Checks: Buzzword Filter • Character Constraints • Anti-Disparagement
            </div>
          </div>
          <div id="violationsContainer" class="mt-3 text-xs space-y-1.5 hidden"></div>
        </div>

        <!-- Channel Output Tabs -->
        <div class="glass-card rounded-2xl p-5 space-y-4">
          <div class="flex items-center justify-between border-b border-slate-700/60 pb-3">
            <div class="flex gap-2" id="channelTabs">
              <button onclick="switchTab('TWITTER_THREAD')" id="tab-TWITTER_THREAD" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-indigo-600 text-white">Twitter Thread</button>
              <button onclick="switchTab('LINKEDIN_POST')" id="tab-LINKEDIN_POST" class="px-3 py-1.5 text-xs font-semibold rounded-lg text-slate-400 hover:text-slate-200">LinkedIn</button>
              <button onclick="switchTab('NEWSLETTER_DIGEST')" id="tab-NEWSLETTER_DIGEST" class="px-3 py-1.5 text-xs font-semibold rounded-lg text-slate-400 hover:text-slate-200">Newsletter</button>
              <button onclick="switchTab('EXECUTIVE_ANNOUNCEMENT')" id="tab-EXECUTIVE_ANNOUNCEMENT" class="px-3 py-1.5 text-xs font-semibold rounded-lg text-slate-400 hover:text-slate-200">Executive</button>
            </div>
            <button onclick="copyCurrentContent()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700 flex items-center gap-1.5">
              <span>📋</span> Copy
            </button>
          </div>

          <!-- Active Post View -->
          <div>
            <textarea id="activeContent" rows="12" 
                      class="w-full bg-slate-900/60 border border-slate-700/50 rounded-xl p-4 text-sm text-slate-100 font-mono leading-relaxed focus:outline-none focus:border-indigo-500"></textarea>
            <div class="flex justify-between items-center text-xs text-slate-400 mt-2 px-1">
              <span id="charCount">0 characters</span>
              <span id="postTags" class="text-indigo-400"></span>
            </div>
          </div>
        </div>

      </div>

    </div>
  </div>

  <script>
    let currentCampaign = null;
    let activeChannel = 'TWITTER_THREAD';

    const SAMPLE_SOURCE = `Release 2.4: Real-Time Intelligent Ledger Reconciliation

We are thrilled to announce Release 2.4 of our financial automation engine. 
This update eliminates manual invoice cross-referencing against internal Purchase Orders.

Highlights:
- Automated 2-Way and 3-Way matching with mathematical tolerance verification.
- Decreased end-of-month reconciliation cycle from 4 days to under 2 hours.
- Strict schema validation with zero hallucination fallback.
- Native integration with modern ERP ledgers via RESTful APIs.

Our customer pilot with 12 enterprise fintech teams showed a 94% reduction in manual billing discrepancies.`;

    function loadSample() {
      document.getElementById('campaignTitle').value = "Financial Ledger Reconciliation v2.4 Launch";
      document.getElementById('sourceText').value = SAMPLE_SOURCE;
    }

    async function generateCampaign() {
      const sourceText = document.getElementById('sourceText').value.trim();
      const title = document.getElementById('campaignTitle').value.trim();
      if (!sourceText) {
        alert("Please enter or load source release notes first.");
        return;
      }

      const channels = [];
      if (document.getElementById('chkTwitter').checked) channels.push('TWITTER_THREAD');
      if (document.getElementById('chkLinkedIn').checked) channels.push('LINKEDIN_POST');
      if (document.getElementById('chkNewsletter').checked) channels.push('NEWSLETTER_DIGEST');
      if (document.getElementById('chkExecutive').checked) channels.push('EXECUTIVE_ANNOUNCEMENT');

      const btn = document.getElementById('btnGenerate');
      btn.disabled = true;
      btn.innerHTML = `<span>Generating...</span><span class="animate-spin">⏳</span>`;

      try {
        const res = await fetch('/api/v1/campaigns', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            source_text: sourceText,
            campaign_title: title || undefined,
            target_channels: channels
          })
        });

        if (!res.ok) throw new Error("Generation failed");
        currentCampaign = await res.json();
        renderCampaign(currentCampaign);
      } catch (err) {
        alert("Error: " + err.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<span>Generate Multi-Channel Campaign</span><span>⚡</span>`;
      }
    }

    function renderCampaign(campaign) {
      // 1. Render Compliance
      const card = document.getElementById('complianceCard');
      const scoreEl = document.getElementById('complianceScore');
      const badge = document.getElementById('complianceBadge');
      const violationsContainer = document.getElementById('violationsContainer');

      scoreEl.innerText = `${campaign.compliance.overall_score}%`;
      if (campaign.compliance.is_compliant) {
        card.className = "glass-card rounded-2xl p-5 border-l-4 border-emerald-500";
        badge.className = "px-2.5 py-0.5 rounded-full text-xs font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30";
        badge.innerText = "PASSED: Brand Compliant";
      } else {
        card.className = "glass-card rounded-2xl p-5 border-l-4 border-rose-500";
        badge.className = "px-2.5 py-0.5 rounded-full text-xs font-bold bg-rose-500/20 text-rose-400 border border-rose-500/30";
        badge.innerText = "FLAGGED: Policy Violations";
      }

      if (campaign.compliance.violations.length > 0) {
        violationsContainer.classList.remove('hidden');
        violationsContainer.innerHTML = campaign.compliance.violations.map(v => `
          <div class="p-2 rounded bg-rose-500/10 border border-rose-500/20 text-rose-300">
            <strong>⚠️ [${v.rule_name}]:</strong> ${v.message}
          </div>
        `).join('');
      } else {
        violationsContainer.classList.add('hidden');
      }

      // 2. Render Active Post
      switchTab(activeChannel);
    }

    function switchTab(channel) {
      activeChannel = channel;
      ['TWITTER_THREAD', 'LINKEDIN_POST', 'NEWSLETTER_DIGEST', 'EXECUTIVE_ANNOUNCEMENT'].forEach(c => {
        const btn = document.getElementById(`tab-${c}`);
        if (btn) {
          if (c === channel) {
            btn.className = "px-3 py-1.5 text-xs font-semibold rounded-lg bg-indigo-600 text-white";
          } else {
            btn.className = "px-3 py-1.5 text-xs font-semibold rounded-lg text-slate-400 hover:text-slate-200";
          }
        }
      });

      if (!currentCampaign) return;
      const post = currentCampaign.posts.find(p => p.channel === channel);
      const activeContent = document.getElementById('activeContent');
      const charCount = document.getElementById('charCount');
      const tags = document.getElementById('postTags');

      if (post) {
        activeContent.value = post.content;
        charCount.innerText = `${post.content.length} characters`;
        tags.innerText = post.tags.map(t => '#' + t).join(' ');
      } else {
        activeContent.value = "Channel not generated in this campaign.";
        charCount.innerText = "0 characters";
        tags.innerText = "";
      }
    }

    function copyCurrentContent() {
      const activeContent = document.getElementById('activeContent');
      navigator.clipboard.writeText(activeContent.value).then(() => {
        alert("Copied to clipboard!");
      });
    }

    // Auto-load sample on startup
    window.addEventListener('DOMContentLoaded', loadSample);
  </script>
</body>
</html>
